mode: rule
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - tls://8.8.8.8
    - tls://1.1.1.1
  direct-nameserver:
    - https://120.53.53.53/dns-query
  nameserver-policy:
    geosite:cn:
      - 223.5.5.5
      - 119.29.29.29
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
  ipv6: false
  listen: 0.0.0.0:7874
  default-nameserver:
    - tls://1.12.12.12
  fake-ip-filter:
    - +.lan
    - +.local
    - +.example.com
    # 连通性探测 / NTP / 推送:需真实 IP,被 fake-ip 劫持会误判无网(许可证站 #165)
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.market.xiaomi.com
    - localhost.ptlogin2.qq.com
    - '*.battlenet.com.cn'
    - stun.*.*.*
    - stun.*.*
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - +.ntp.org
    - +.pool.ntp.org
    # 安卓 / Google Play 连通性 + GMS 推送:被 fake-ip 劫持会导致 Play 无法更新
    - mtalk.google.com
    # FCM 实际使用的主机名(Firebase network-configuration)。旧写法用 alt 星号做 label 内
    # 部分通配 —— mihomo domain trie 从不当通配处理(哑规则),且 v1.19.30 起直接判
    # invalid domain 令整份配置拒绝加载。而真实 FCM 主机 alt1-mtalk.google.com 是
    # google.com 直接子域(连字符,非点号),任何 mtalk 前的整-label 通配都够不着,只能逐条列。
    - '*.mtalk.google.com'
    - mtalk4.google.com
    - mtalk-staging.google.com
    - mtalk-dev.google.com
    - alt1-mtalk.google.com
    - alt2-mtalk.google.com
    - alt3-mtalk.google.com
    - alt4-mtalk.google.com
    - alt5-mtalk.google.com
    - alt6-mtalk.google.com
    - alt7-mtalk.google.com
    - alt8-mtalk.google.com
    - android.apis.google.com
    - +.gvt1.com
    - +.gvt2.com
    - +.gvt3.com
    - connectivitycheck.gstatic.com
    - connectivitycheck.android.com
    - clients3.google.com
    - '*.googleapis.cn'
proxies: null
proxy-groups:
  - name: 🚀 手动选择
    type: select
    include-all: true
    include-all-proxies: true
    include-all-providers: true
    proxies:
      - ♻️ 自动选择
      - __PROXY_PROVIDERS__
      - __PROXY_NODES__
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    include-all-proxies: true
    include-all-providers: true
    proxies:
      - __PROXY_PROVIDERS__
      - __PROXY_NODES__
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🚀 GitHub
    type: select
    include-all: true
    include-all-proxies: true
    include-all-providers: true
    proxies:
